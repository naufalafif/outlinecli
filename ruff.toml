# Ruff config for the single-file `outline` CLI.
# The script has no `.py` extension, so include it explicitly.
target-version = "py310"
line-length = 88
extend-include = ["outline"]

[lint]
# E/F: pyflakes + pycodestyle, I: isort, B: bugbear, S: flake8-bandit
# (security), UP: pyupgrade, SIM: simplify, RUF: ruff-specific.
select = ["E", "F", "I", "B", "S", "UP", "SIM", "RUF"]
